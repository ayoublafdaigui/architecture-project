apiVersion: v1
kind: Secret
metadata:
  name: mediapulse-secrets
  namespace: mediapulse
type: Opaque
# Les valeurs sont en base64 — remplacer avant le déploiement
# echo -n "valeur" | base64
stringData:
  MINIO_ROOT_USER: "mediapulse_minio"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_MINIO_PASSWORD"
  POSTGRES_USER: "mediapulse"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_PASSWORD"
