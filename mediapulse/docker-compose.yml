name: mediapulse

x-mediapulse-env: &mediapulse-env
  - .env.example
  - path: .env
    required: false

x-airflow-build: &airflow-build
  context: .
  dockerfile: Dockerfile.airflow

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - mediapulse-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - mediapulse-net

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    env_file: *mediapulse-env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mediapulse-net

  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    depends_on:
      - minio
    env_file: *mediapulse-env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "
    networks:
      - mediapulse-net

  postgres:
    image: postgres:16
    env_file: *mediapulse-env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    networks:
      - mediapulse-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mediapulse-net

  airflow-init:
    build: *airflow-build
    image: mediapulse-airflow:latest
    depends_on:
      - postgres
      - redis
    env_file: *mediapulse-env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt
    user: "0:0"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Media --lastname Pulse --role Admin --email admin@example.com || true
      "
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/mediapulse:ro
      - airflow-logs:/opt/airflow/logs
    networks:
      - mediapulse-net

  airflow-webserver:
    build: *airflow-build
    image: mediapulse-airflow:latest
    depends_on:
      - airflow-init
    env_file: *mediapulse-env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/mediapulse:ro
      - airflow-logs:/opt/airflow/logs
    networks:
      - mediapulse-net

  airflow-scheduler:
    build: *airflow-build
    image: mediapulse-airflow:latest
    depends_on:
      - airflow-init
    env_file: *mediapulse-env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/mediapulse:ro
      - airflow-logs:/opt/airflow/logs
    networks:
      - mediapulse-net

  airflow-worker:
    build: *airflow-build
    image: mediapulse-airflow:latest
    depends_on:
      - airflow-init
    env_file: *mediapulse-env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt
    command: celery worker --hostname worker@%h
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/mediapulse:ro
      - airflow-logs:/opt/airflow/logs
    networks:
      - mediapulse-net

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - minio-init
    env_file: *mediapulse-env
    networks:
      - mediapulse-net

  stream-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - minio-init
    env_file: *mediapulse-env
    command: ["python", "-m", "mediapulse.ingestion.kafka_consumer", "--batch-size", "50"]
    networks:
      - mediapulse-net

  warehouse-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file: *mediapulse-env
    command: ["python", "-m", "mediapulse", "apply-schema"]
    networks:
      - mediapulse-net

  demo-seed:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully
    env_file: *mediapulse-env
    command: ["python", "-m", "mediapulse", "seed-demo", "--days", "14", "--articles-per-day", "16"]
    profiles:
      - demo
    networks:
      - mediapulse-net

  metabase:
    image: metabase/metabase:v0.50.18
    depends_on:
      - postgres
    env_file: *mediapulse-env
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    networks:
      - mediapulse-net

  prometheus:
    image: prom/prometheus:v2.53.1
    depends_on:
      - postgres-exporter
      - kafka-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./dashboard/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./dashboard/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mediapulse-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-mediapulse}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-mediapulse}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - mediapulse-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    depends_on:
      - kafka
    command:
      - --kafka.server=kafka:29092
    ports:
      - "9308:9308"
    networks:
      - mediapulse-net

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    env_file: *mediapulse-env
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboard/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mediapulse-net

networks:
  mediapulse-net:
    driver: bridge

volumes:
  kafka-data:
  minio-data:
  postgres-data:
  airflow-logs:
  metabase-data:
  prometheus-data:
  grafana-data:
