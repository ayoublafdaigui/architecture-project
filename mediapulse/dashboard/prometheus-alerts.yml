groups:
  - name: mediapulse-platform
    rules:
      - alert: MediaPulseTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MediaPulse scrape target is down"
          description: "Prometheus target {{ $labels.job }} / {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: MediaPulseKafkaConsumerLag
        expr: kafka_consumergroup_lag > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MediaPulse Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} has lag above 1000 for more than 10 minutes."

      - alert: MediaPulsePostgresExporterErrors
        expr: pg_exporter_last_scrape_error > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MediaPulse PostgreSQL exporter scrape errors"
          description: "The PostgreSQL exporter has reported scrape errors for more than 5 minutes."
