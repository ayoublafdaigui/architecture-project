apiVersion: 1

datasources:
  - name: MediaPulse Warehouse
    uid: mediapulse-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true

  - name: Prometheus
    uid: mediapulse-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
